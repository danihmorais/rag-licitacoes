name: Patch rerank gate

on:
  push:
    branches:
      - fix/auditoria-rag-autoridade-metadados

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Corrigir gate de evidência
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('query.py')
          text = path.read_text(encoding='utf-8')
          old = """    if not output or output[0].payload.get('_evidence_score', 0.0) < config.MIN_EVIDENCE_SCORE:\n        return []\n    return sorted(output, key=lambda point: (-point.payload.get('_evidence_score', 0.0), point.payload.get('authority_level') if point.payload.get('authority_level') is not None else 9))\n"""
          new = """    output = [point for point in output if point.payload.get('_evidence_score', 0.0) >= config.MIN_EVIDENCE_SCORE]\n    if not output:\n        return []\n    return sorted(output, key=lambda point: (-point.payload.get('_evidence_score', 0.0), point.payload.get('authority_level') if point.payload.get('authority_level') is not None else 9))\n"""
          if old not in text:
              raise SystemExit('Trecho esperado não encontrado; nenhuma alteração realizada.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add query.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: aplicar gate de evidence score por candidato"
          git push

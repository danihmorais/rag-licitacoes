name: Recover PR49 snapshot

on:
  push:
    branches: [main]
    paths:
      - "recovery/READY"

permissions:
  contents: write

jobs:
  recover:
    if: hashFiles('recovery/READY') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import PR49 git objects and restore exact ref
        shell: bash
        run: |
          set -euo pipefail

          test -f recovery/READY
          mkdir -p /tmp/rag-recovery

          cat recovery/.pack-a-* > /tmp/rag-recovery/a.b64
          base64 -d /tmp/rag-recovery/a.b64 > /tmp/rag-recovery/a.pack
          git index-pack --stdin --fix-thin < /tmp/rag-recovery/a.pack

          cat recovery/.pack-b-* > /tmp/rag-recovery/b.b64
          base64 -d /tmp/rag-recovery/b.b64 > /tmp/rag-recovery/b.pack
          git index-pack --stdin --fix-thin < /tmp/rag-recovery/b.pack

          target="1be2249333869b9cd060da8ae9f0cd9f99c67a02"
          git cat-file -e "$target^{commit}"

          git reset --hard "$target"
          git clean -fdx
          rm -rf recovery

          git push --force origin HEAD:main

name: Smoke das fontes jurídicas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/legal-ingestion.yml'
      - 'scripts/sync_sources.py'
      - 'scripts/web_sources.py'
      - 'scripts/sources.py'
      - 'jurisprudencia/**'
      - 'chunking.py'
      - 'ingest.py'
      - 'metadata.py'
      - 'query.py'
      - 'config.py'
      - 'evaluation.py'
      - 'index_manifest.py'
      - 'embedding_utils.py'
      - 'evaluation/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'requirements.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legal-ingestion.yml'
      - 'scripts/sync_sources.py'
      - 'scripts/web_sources.py'
      - 'scripts/sources.py'
      - 'jurisprudencia/**'
      - 'chunking.py'
      - 'ingest.py'
      - 'metadata.py'
      - 'query.py'
      - 'config.py'
      - 'evaluation.py'
      - 'index_manifest.py'
      - 'embedding_utils.py'
      - 'evaluation/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: legal-ingestion-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports:
          - 6333:6333
        # A imagem oficial do Qdrant não precisa de um healthcheck externo
        # baseado em wget/curl. A prontidão é validada explicitamente pelo runner.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-ci.txt pytest

      - name: Aguardar Qdrant Server
        run: |
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          url = "http://127.0.0.1:6333/healthz"
          deadline = time.time() + 90
          last_error = None
          while time.time() < deadline:
              try:
                  with urlopen(url, timeout=3) as response:
                      if 200 <= response.status < 300:
                          print(f"Qdrant Server pronto: HTTP {response.status}")
                          raise SystemExit(0)
              except Exception as exc:
                  last_error = exc
              time.sleep(2)

          raise SystemExit(f"Qdrant Server não ficou pronto em 90s: {last_error}")
          PY

      - name: Testar uma legislação por domínio do catálogo
        run: |
          python scripts/sync_sources.py --legislation-only --one-per-domain --strict --no-follow-links

      - name: Coletar exatamente 5 matérias por website
        run: |
          set -o pipefail
          python scripts/sync_sources.py             --web-only             --max-web-documents 5             --max-web-discovery-pages 25             --strict             2>&1 | tee web-smoke.log

          expected_web_sources=(
            web-nova-lei-licitacao
            web-licitacoes-publicas-blog
            web-zenite
            web-migalhas
            web-conjur
          )

          for source_id in "${expected_web_sources[@]}"; do
            if ! grep -Eq "^OK ${source_id}: 5 matérias aceitas " web-smoke.log; then
              echo "::error::${source_id} não entregou exatamente 5 matérias válidas."
              grep -E "^OK ${source_id}:|^FAIL ${source_id}:" web-smoke.log || true
              exit 1
            fi
          done

          echo "Todos os 5 websites entregaram exatamente 5 matérias válidas."

      - name: Instalar Chromium para a coleta de jurisprudência
        run: |
          python -m playwright install --with-deps chromium

      - name: Coletar 5 registros por tribunal
        run: |
          python -m jurisprudencia.batch             --tribunais tcu,stf,tjsp,tcesp             --query "licitação"             --limit 5             --per-query-limit 5             --min-records-per-tribunal 5             --strict             --without-sumulas
          echo "::notice::STJ não é incluído na validação live deste workflow porque o ambiente do GitHub Actions recebe HTTP 403 do SCON e do Portal de Dados Abertos do STJ."
          python -m pytest -q tests/test_jurisprudencia.py -k stj --disable-warnings

      - name: Coletar todas as Súmulas TCU e TCESP
        run: |
          python -m jurisprudencia.sumulas --strict

      - name: Testes offline
        run: python -m pytest -q

      - name: E2E estrutural com Qdrant Server
        env:
          RAG_E2E_QDRANT: '1'
          RAG_QDRANT_URL: http://127.0.0.1:6333
          RAG_QDRANT_PREFER_GRPC: '0'
          RAG_FASTEMBED_REQUIRE_CUDA: '0'
          RAG_FASTEMBED_PROVIDERS: CPUExecutionProvider
        run: python -m pytest -q tests/test_real_fixture_e2e.py

      - name: Publicar evidências do smoke em caso de falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: legal-ingestion-smoke-debug
          path: |
            web-smoke.log
            db/source_cache/
          if-no-files-found: ignore

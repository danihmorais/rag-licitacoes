name: Ingestão completa da legislação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Validar catálogo e fontes legislativas
        run: |
          python scripts/sync_sources.py --check --legislation-only --strict --no-follow-links

      - name: Sincronizar legislação e corpus disponível
        run: |
          python scripts/sync_sources.py --strict --no-follow-links

      - name: Indexar legislação no Qdrant
        env:
          RAG_SYNC_SOURCES: "0"
          RAG_SYNC_JURISPRUDENCIA: "0"
          RAG_RAG_PRUNE_STALE: "1"
        run: |
          python ingest.py

      - name: Verificar consulta sobre legislação indexada
        env:
          RAG_SYNC_SOURCES: "0"
          RAG_SYNC_JURISPRUDENCIA: "0"
          RAG_LLM_PROVIDER: "openai_compatible"
          RAG_LLM_MODEL: "ci"
          RAG_OPENAI_BASE_URL: "http://127.0.0.1:9/v1"
        run: |
          python -m pytest -q tests/test_sync_sources.py tests/test_sync_policy.py tests/test_rag.py

name: Smoke das fontes jurídicas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/legal-ingestion.yml'
      - 'scripts/sync_sources.py'
      - 'scripts/web_sources.py'
      - 'scripts/sources.py'
      - 'jurisprudencia/**'
      - 'tests/**'
      - 'requirements.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/legal-ingestion.yml'
      - 'scripts/sync_sources.py'
      - 'scripts/web_sources.py'
      - 'scripts/sources.py'
      - 'jurisprudencia/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: legal-ingestion-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Sincronizar todas as legislações explícitas do catálogo
        run: |
          python scripts/sync_sources.py --legislation-only --strict --no-follow-links

      - name: Coletar exatamente 5 matérias por website
        run: |
          set -o pipefail
          python scripts/sync_sources.py             --web-only             --max-web-documents 5             --max-web-discovery-pages 25             --strict             2>&1 | tee web-smoke.log

          expected_web_sources=(
            web-nova-lei-licitacao
            web-licitacoes-publicas-blog
            web-conlicitacao
            web-zenite
            web-migalhas
            web-conjur
          )

          for source_id in "${expected_web_sources[@]}"; do
            if ! grep -Eq "^OK ${source_id}: 5 matérias aceitas " web-smoke.log; then
              echo "::error::${source_id} não entregou exatamente 5 matérias válidas."
              grep -E "^OK ${source_id}:|^FAIL ${source_id}:" web-smoke.log || true
              exit 1
            fi
          done

          echo "Todos os 6 websites entregaram exatamente 5 matérias válidas."

      - name: Instalar Chromium para a coleta de jurisprudência
        run: |
          python -m playwright install --with-deps chromium

      - name: Coletar 5 registros por tribunal
        run: |
          python -m jurisprudencia.batch             --tribunais tcu,stj,stf,tjsp,tcesp             --query "licitação"             --limit 5             --per-query-limit 5             --min-records-per-tribunal 5             --strict             --without-sumulas

      - name: Coletar todas as Súmulas TCU e TCESP
        run: |
          python -m jurisprudencia.sumulas --strict

      - name: Testes offline
        run: python -m pytest -q

      - name: Publicar evidências do smoke em caso de falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: legal-ingestion-smoke-debug
          path: |
            web-smoke.log
            db/source_cache/
          if-no-files-found: ignore
name: Validação manual das fontes legislativas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-sync.txt pytest

      - name: Sincronizar legislação e corpus disponível
        run: |
          python scripts/sync_sources.py --legislation-only --strict --no-follow-links

      - name: Testar código e política do RAG
        run: |
          python -m pytest -q

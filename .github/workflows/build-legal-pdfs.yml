name: Atualizar PDFs jurídicos

on:
  push:
    paths:
      - 'scripts/build_legal_pdfs.py'
      - '.github/workflows/build-legal-pdfs.yml'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install --disable-pip-version-check requests beautifulsoup4 reportlab
      - name: Gerar PDFs
        run: python scripts/build_legal_pdfs.py
      - name: Validar PDFs gerados
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdfs = sorted(Path('pdfs').glob('*.pdf'))
          assert pdfs, 'nenhum PDF gerado'
          for p in pdfs:
              assert p.name.rsplit('.', 2)[-2].isdigit() and len(p.name.rsplit('.', 2)[-2]) == 8, f'sem data no nome: {p.name}'
              pages = len(PdfReader(str(p)).pages)
              assert pages > 0, f'PDF vazio: {p}'
          print(f'{len(pdfs)} PDFs válidos')
          PY
      - name: Commitar PDFs gerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdfs/*.pdf pdfs/*.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nos PDFs.'
          else
            git commit -m 'docs: atualizar corpus juridico em PDFs'
            git push
          fi

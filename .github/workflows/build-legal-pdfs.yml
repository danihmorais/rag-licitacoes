name: Atualizar PDFs jurídicos

on:
  push:
    paths:
      - 'scripts/build_legal_pdfs.py'
      - '.github/workflows/build-legal-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install --disable-pip-version-check requests beautifulsoup4 reportlab
      - name: Gerar PDFs
        run: python scripts/build_legal_pdfs.py
      - name: Commitar PDFs gerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdfs/*.pdf
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nos PDFs.'
          else
            git commit -m 'docs: atualizar corpus juridico em PDFs'
            git push
          fi

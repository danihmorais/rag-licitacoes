name: Saúde das fontes jurídicas oficiais

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-sources-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-sync.txt
      - name: Verificar fontes obrigatórias (não bloqueante)
        run: |
          set +e
          python scripts/sync_sources.py --check --required-only --no-follow-links
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Uma ou mais fontes oficiais não responderam/foram rejeitadas. O catálogo permanece versionado e o cache local anterior é preservado."
          fi
          exit 0

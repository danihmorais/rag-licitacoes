name: Verificar fontes juridicas oficiais

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-sources-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Verificar fontes obrigatórias
        run: python scripts/sync_sources.py --check --required-only

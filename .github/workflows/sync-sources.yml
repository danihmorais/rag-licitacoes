name: Verificar fontes jurídicas oficiais

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-sources-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements-sync.txt
      - name: Verificar fontes obrigatórias
        run: python scripts/sync_sources.py --check --required-only

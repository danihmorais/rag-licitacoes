name: Saúde da jurisprudência oficial

on:
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurisprudencia-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sync.txt
      - name: Instalar dependências da coleta
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-sync.txt
      - name: Testar jurisprudência oficial em tempo real
        run: |
          python -m jurisprudencia.batch             --tribunais tcu,tcesp,stj,stf,tcm-sp,tjsp             --query "licitação"             --limit 1             --strict

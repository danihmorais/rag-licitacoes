name: Saúde da jurisprudência oficial

on:
  schedule:
    - cron: '15 7 * * 1'
  pull_request:
    paths:
      - 'jurisprudencia/**'
      - 'scripts/sources.py'
      - 'tests/test_jurisprudencia*.py'
      - 'tests/test_sumulas.py'
      - 'requirements.txt'
      - '.github/workflows/jurisprudencia-health.yml'
  push:
    branches:
      - main
    paths:
      - 'jurisprudencia/**'
      - 'scripts/sources.py'
      - 'tests/test_jurisprudencia*.py'
      - 'tests/test_sumulas.py'
      - 'requirements.txt'
      - '.github/workflows/jurisprudencia-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jurisprudencia-health-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências da coleta
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Testar 5 registros em cada tribunal
        run: |
          python -m jurisprudencia.batch             --tribunais tcu,stj,stf,tjsp,tcesp             --query "licitação"             --limit 5             --per-query-limit 5             --min-records-per-tribunal 5             --strict             --without-sumulas
      - name: Testar todas as Súmulas TCU e TCESP
        run: |
          python -m jurisprudencia.sumulas --strict
      - name: Publicar cache da coleta quando houver falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jurisprudencia-health-debug
          path: db/source_cache/jurisprudencia/
          if-no-files-found: ignore
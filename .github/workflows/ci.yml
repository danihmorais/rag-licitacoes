name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'pdfs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Verificar sintaxe
        run: python -m compileall -q .
      - name: Testes
        run: python -m pytest -q
